<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070707" />
    <title>Cortex Remote</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
        background: #050505;
        color: #ddd;
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      body {
        margin: 0;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        background: #1e1e1f;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        min-height: 36px;
        padding: 6px 10px;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid #69df80;
      }
      button:disabled {
        opacity: 0.5;
      }
      button:hover {
        background: #29292a;
      }
      .on {
        color: #75ee87;
      }
      .shell {
        max-width: 1700px;
        margin: auto;
        padding: 0 12px 12px;
      }
      header,
      footer,
      .bar,
      .panelhead,
      .actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      header {
        height: 54px;
        justify-content: space-between;
        border-bottom: 1px solid #222;
      }
      header strong {
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .desk-heading { display:grid; min-width:0; gap:3px; }
      .device-name { display:flex; align-items:center; gap:7px; min-width:0; }
      .device-name img { width:16px; height:21px; flex:none; }
      .device-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .desk-status { font-size:11px; color:#aaa; overflow-wrap:anywhere; }
      .desk-status span::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:#888; }
      .desk-status [data-connected=true]::before { background:#4eec69; }
      .shell > header { height:auto; min-height:54px; }
      .signal-meters {
        display: grid;
        gap: 3px;
        width: clamp(117px, 15vw, 210px);
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #141414;
      }
      .signal-line {
        display: grid;
        grid-template-columns: 2.3em minmax(0, 1fr) 6em;
        align-items: center;
        gap: 4px;
        font: 600 10px/1.2 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .signal-line > :last-child { text-align: right; color: #bbb; white-space: nowrap; }
      .signal-line .signal-clip { color: #ff6468; }
      .signal-track {
        position: relative;
        display: block;
        height: 5px;
        overflow: hidden;
        border-radius: 4px;
        background: #303030;
      }
      .signal-track::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #40d771 0 64%, #f4d44f 81%, #ff554c 96%);
        clip-path: inset(0 calc(100% - var(--signal-fill)) 0 0);
        transition: clip-path 80ms linear;
      }
      .port { position: relative; }
      .port:has(.port-signal) { padding-bottom: 10px; }
      .port-signal { position: absolute; bottom: 4px; left: 15%; right: 15%; }
      .port-signal .signal-track { height: 3px; }
      .port-signal-muted { height: 3px; border-radius: 4px; background: #ff4656; }

      @media (max-width:540px) {
        .shell > header { flex-wrap:wrap; padding:5px 0; }
        .shell > header nav { order:1; width:100%; }
        .desk-heading { flex:1; }
      }
      nav {
        display: flex;
        align-self: stretch;
      }
      nav button {
        background: transparent;
        border-radius: 0;
        color: #888;
        padding: 0 18px;
      }
      nav .current {
        color: white;
        border-top: 2px solid #4eec69;
      }
      .workspace {
        display: grid;
        grid-template-columns: clamp(142px, 22vw, 270px) minmax(0, 1fr);
        gap: 9px;
        margin-top: 8px;
      }
      aside,
      .panel,
      .dialog {
        background: #141415;
        border-radius: 8px;
      }
      aside {
        overflow: auto;
        height: calc(100dvh - 104px);
        padding: 4px;
      }
      .entry {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        width: 100%;
        background: transparent;
        min-height: 42px;
      }
      .entry.model {
        touch-action: pan-y;
      }
      .icon {
        display: grid;
        place-items: center;
        background: #101010;
        border: 2px solid var(--c);
        border-radius: 12px;
        color: #ddd;
        font-size: 23px;
        line-height: 1;
        width: 46px;
        height: 46px;
        flex: none;
      }
      .bar {
        flex-wrap: wrap;
      }
      .preset {
        flex: 1;
        text-align: left;
        min-width: 140px;
      }
      .preset[data-dirty="true"] {
        font-style: italic;
      }
      .scene {
        padding: 4px;
        min-width: 30px;
      }
      .scene.active {
        background: #ffc831;
        color: #121212;
      }
      .scroll {
        overflow: auto;
      }
      .board {
        position: relative;
        min-width: 470px;
        display: grid;
        grid-template-columns: var(--port-width) repeat(8,minmax(0,1fr)) var(--port-width);
        --port-width:48px; grid-template-rows:repeat(4,80px);
        align-items: center;
        justify-items: center;
      }
      .wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .port,
      .cell {
        z-index: 1;
      }
      .port {
        box-sizing:border-box; width:var(--port-width); height:68px; min-height:0; padding:2px;
        border-radius:12px; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:5px; color:#ddd; background:#131314;
        font-size:13px; line-height:1.35;
      }
      .port {position:relative}
      .port[aria-pressed=true] {box-shadow:inset 0 0 0 2px #45ec66}
      .port-status {position:absolute;left:22%;right:22%;height:4px;border-radius:4px}
      .port-input .port-status {top:9%;background:#272727;overflow:hidden}.port-status>i {display:block;height:100%;background:#ffc928;transition:width 90ms linear}
      .port-output .port-status {bottom:9%;background:#ff3046}
      .port-input {justify-self:start}
      .port-output {justify-self:end}
      .route-node {position:absolute; transform:translate(-50%,-50%); z-index:3;
        width:24px; height:24px; min-height:0; padding:0; border-radius:50%;
        color:white; border:1px solid var(--route); background:var(--route);
        font:600 13px/1 sans-serif; touch-action:none; user-select:none;}
      .route-node.start {--route:#007bec}
      .route-node.end {--route:#da009c}
      .route-node.parked {background:#0a0a0b; color:var(--route)}
      .route-node:hover,.route-node:focus-visible {background:var(--route);color:#fff}
      .route-node::before {content:"";position:absolute;inset:-5px;border-radius:50%}
      .cell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        position: relative;
      }
      .tile {
        background: #101010;
        padding: 0;
        touch-action: none;
        border-radius: 12px;
      }
      .tile.muted { opacity:1; }
      .tile.muted .icon { filter:brightness(.44); }
      .cell .del {
        display: none;
        position: absolute;
        left: calc(50% + 10px);
        top: calc(50% - 33px);
        background: #aaa;
        color: black;
        border-radius: 100%;
        font: 16px/1 sans-serif;
        min-height: 24px;
        width: 24px;
        padding: 0;
      }
      @media (hover:hover) and (pointer:fine) {
        .cell:hover .del { display:block; }
      }
      .cell .selected + .del {
        display: block;
      }
      .empty {
        background: transparent;
        color: transparent;
      }
      .cell:hover .empty,
      .cell.target .empty,
      .cell.drop .empty {
        color: white;
        background: #222;
      }
      .cell.drop {
        background: #324c3c88;
      }
      .panel {
        margin-top: 8px;
        overflow: hidden;
      }
      .panelhead {
        padding: 5px 8px;
        border-bottom: 1px solid #333;
      }
      .grow {
        flex: 1;
      }
      .params {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .param {
        position: relative;
        height: 99px;
        background: #202021;
        border-right: 1px solid #101010;
        border-bottom: 1px solid #101010;
        border-radius: 0;
        text-align: left;
        padding: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .param { -webkit-touch-callout:none; }
      .param small {
        position: absolute;
        top: 9px;
        left: 8px;
        font-size: 10px;
      }
      .param output {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 11px;
      }
      .gate-track {position:absolute;left:9px;right:9px;bottom:24px;height:7px;background:#111;border-radius:2px;overflow:hidden}
      .gate-track i {display:block;height:100%;background:#f6cb39;transition:width 80ms linear}
      .param-push { position:absolute; bottom:12px; left:10px; padding:8px 16px; border-radius:4px; background:#0b0b0b; color:#ccc; font-weight:600; }
      .choice-param[aria-pressed="true"] .param-push { background:#eee; color:#111; }
      .port-panel .route-title {color:#999;font-weight:400}
      .port-panel .route-title b {font-weight:400;color:#eee;margin-left:4px}
      .port-panel .param-push {left:10%;width:80%;bottom:32%;height:30%;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;color:#aaa;background:#121212}
      .port-panel [aria-label="MUTE"][aria-pressed="true"] .param-push {background:#ff292c;color:#111}
      .scene-mark {position:absolute;left:10px;top:50%;transform:translateY(-50%);color:white;line-height:0;pointer-events:none}
      .param:has(.scene-mark) .dial {border-color:white}
      .choice-param:has(.scene-mark) :is(.param-switch,.param-select,.param-push) {margin-left:24px; max-width:calc(90% - 24px)}

      .port-panel .gate-track {bottom:6px}
      .port-panel .gate-meter output {bottom:19px}
      .port-panel .dial {width:clamp(30px,4vw,54px);height:auto;aspect-ratio:1;bottom:4px;right:6px;border:5px solid #111;box-shadow:inset 0 0 0 2px #080808}
      .port-panel .dial:after {left:calc(50% - 1px);top:0;height:49%}
      .port-panel .param:has(.dial)::before {content:"";position:absolute;right:6px;bottom:4px;width:clamp(30px,4vw,54px);aspect-ratio:1;box-sizing:border-box;background:conic-gradient(from 225deg,#eee 0 var(--sweep),#090909 var(--sweep) 270deg,transparent 270deg);border-radius:50%;mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000);z-index:1;pointer-events:none}
      .choice-param { color:#ddd; }
      .param-switch { position:absolute; bottom:10px; left:8px; display:grid; grid-template-columns:20px auto; grid-template-rows:22px 22px; align-items:center; gap:0 8px; font-size:12px; color:#888; }
      .param-switch i { position:relative; grid-row:span 2; width:18px; height:43px; background:black; border-radius:12px; }
      .param-switch i::after { content:""; position:absolute; left:2px; bottom:var(--switch-position,3px); width:14px; height:14px; border:2px solid var(--c); box-sizing:border-box; border-radius:50%; }
      .param-switch .current { color:#f2f2f2; }
      .param-select { position:absolute; left:8px; right:8px; bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:5px; padding:7px 9px; background:#111; border-radius:5px; font-size:12px; }
      .param-select span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .param-options { position:fixed; z-index:20; overflow:auto; overscroll-behavior:contain; background:#080808; padding:4px; border:1px solid #333; border-radius:7px; box-shadow:0 5px 18px #000a; }
      .param-options button { display:block; width:100%; min-height:36px; padding:6px 10px; text-align:left; color:#aaa; background:none; }
      .param-options button:hover,.param-options button:focus { background:#2d2d2d; }
      .param-options button[aria-selected=true] { background:#2d2d2d; color:#3f6; }
      .dial {
        position: absolute;
        right: 8px;
        bottom: 12px;
        border: 2px solid var(--c);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        transform: rotate(var(--angle));
        background: #121212;
      }
      .dial:after {
        content: "";
        position: absolute;
        top: 3px;
        left: 15px;
        background: #eee;
        height: 13px;
        width: 2px;
      }
      .muted {
        opacity: 0.44;
      }
      .ghost {
        position: fixed;
        pointer-events: none;
        z-index: 6;
        transform: translate(-50%, -50%);
      }
      footer {
        color: #aaa;
        font-size: 12px;
        min-height: 36px;
      }
      .shade {
        position: fixed;
        inset: 0;
        background: #000a;
        display: grid;
        place-items: center;
        z-index: 5;
      }
      .dialog {
        padding: 18px;
        width: min(540px, 92vw);
        max-height: 82dvh;
        overflow: auto;
        border: 1px solid #333;
      }
      .dialog h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      .dialog label {
        display: grid;
        gap: 5px;
        margin: 10px 0;
      }
      .dialog input {
        padding: 8px;
      }
      .dialog .actions {
        margin-top: 12px;
        justify-content: flex-end;
      }
      .directory {
        display: grid;
        gap: 3px;
      }
      .directory button {
        text-align: left;
      }
      .slotno {
        display: inline-block;
        width: 46px;
        color: #999;
      }
      .gig {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 20px 0;
      }
      .gig button {
        height: 15vh;
        font-size: 30px;
      }
      .gig .active {
        background: #ffc831;
        color: #000;
      }
      @media (max-width: 700px) {
        .workspace {
          grid-template-columns: 100px minmax(0, 1fr);
        }
        aside {
          font-size: 11px;
        }
        .entry {
          padding: 4px;
          gap: 4px;
        }
        .entry .icon {
          width: 28px;
          height: 28px;
          font-size: 16px;
        }
        .params {
          grid-template-columns: repeat(2, 1fr);
        }
        nav button {
          padding: 0 8px;
        }
        .scene {
          min-width: 28px;
        }
      }
      @media (pointer: coarse) {
        button {
          min-height: 42px;
        }
        .cell .del {
          min-height: 26px;
          width: 26px;
        }
      }
      .picker {
        display: grid;
        grid-template-columns: 144px 1fr;
        gap: 14px;
        margin-top: 12px;
      }
      .banks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        align-content: start;
      }
      .banks button {
        padding: 3px;
      }
      .directory {
        align-content: start;
      }
      .dialog > input {
        width: 100%;
      }
      @media (max-width: 480px) {
        .picker {
          grid-template-columns: 84px 1fr;
        }
        .banks {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      aside.expanded {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        padding: 0;
        overflow: hidden;
      }
      .models,
      .rail {
        overflow-y: auto;
      }
      .rail button {
        background: transparent;
        border-radius: 0;
        display: grid;
        place-items: center;
        width: 100%;
        height: 52px;
        padding: 0;
      }
      .rail .icon {
        border: 0;
        background: transparent;
        font-size: 17px;
        width: 24px;
        height: 28px;
        color: #888;
      }
      .rail .category-label {display:none}
      .rail button[aria-pressed=true] {
        color:#abf3b6;
        background:#233c29;
        box-shadow:inset 3px 0 #45ec66;
      }
      .models .entry.model {
        font-size: 12px;
        min-height: 35px;
      }
      .models .entry.model.on {
        background: #222;
      }
      .icon {
        object-fit: contain;
        background: none;
        border: 0;
      }
      .entry.model .icon {
        width: 26px;
        height: 26px;
      }
      .entry.model small {
        display: block;
        color: #999;
      }
      .libsearch {
        width: 100%;
        padding: 7px;
        margin: 5px 0;
      }
      .workspace main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 106px);
      }
      .gig-panel {
        margin-top: auto;
        padding-top: 10px;
        display: grid;
        grid-template-columns: minmax(92px, 20%) 1fr;
        min-height: clamp(145px, 28vh, 265px);
      }
      .gig-side {
        display: flex;
        flex-direction: column;
        background: #2d2d2d;
        border-radius: 6px 0 0 6px;
        overflow: hidden;
      }
      .gig-side > div,
      .gig-side button {
        background: #202020;
        padding: 8px;
        text-align: left;
      }
      .gig-side strong {
        flex: 1;
        display: flex;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
        padding: 8px;
      }
      .gig-side button {
        border-top: 1px solid #080808;
        font-size: 11px;
      }
      .gig-scenes {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 1fr 1fr;
        gap: 1px;
        border-radius: 0 6px 6px 0;
        overflow: hidden;
        background: #090909;
      }
      .gig-scenes button {
        position: relative;
        border-radius: 0;
        isolation: isolate;
        overflow: hidden;
        color: #d0d0d0;
        background: var(
          --scene-shade,
          color-mix(in srgb, var(--scene-color) 10%, #141414)
        );
        font-size: clamp(12px, 1.7vw, 22px);
        padding: 4px;
      }
      .gig-scenes button:disabled {
        opacity: 1;
        cursor: default;
      }
      .gig-scenes button.active {
        background: var(--scene-color);
        color: #101010;
      }
      .gig-scenes b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(40px, 8vh, 95px);
        font-weight: 600;
        color: var(--scene-color);
        opacity: 0.11;
        z-index: -1;
      }
      .gig-scenes button.active b {
        color: #151515;
      }
      .plugin-children {
        border-left: 1px solid #363636;
        margin: 0 0 5px 12px;
        padding-left: 5px;
      }
      .product[aria-expanded="true"] {
        color: #65df7a;
        background: #242424;
      }
      .product span {
        color: #888;
      }
      .plugin-section summary {
        padding: 10px 4px;
        font-size: 10px;
        color: #bbb;
        cursor: pointer;
      }
      .product {
        border: 1px solid #333;
        margin: 2px 0;
        font-size: 12px;
      }
      .foot-gig {
        min-height: 24px;
        font-size: 10px;
      }
      .foot-gig[aria-pressed="true"] {
        background: #888;
        color: #171717;
      }
      footer {
        gap: 14px;
      }
      .scroll-end {
        height: 2px;
      }
      .capture-tools,
      .capture-tabs {
        display: flex;
        gap: 3px;
        margin: 4px 0;
      }
      .capture-tools input,
      .capture-tools select {
        min-width: 0;
        flex: 1;
        width: 100%;
        background: #242424;
        border: 0;
        border-radius: 3px;
        padding: 5px;
      }
      .capture-tabs button {
        flex: 1;
        font-size: 10px;
      }
      .capture-tabs button[aria-pressed="true"] {
        background: #353535;
      }
      .folder-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        margin: 2px 0;
        font-size: 11px;
        min-height: 35px;
        border: 1px solid #333;
        background: #202020;
      }
      .capture-children {
        padding-left: 7px;
      }
      .pin {
        color: #42e753;
      }
      .capture-browser .entry.model {
        min-height: 32px;
      }
      .capture-browser .entry.model small {
        display: none;
      }

footer {gap:4px;flex-wrap:wrap}
footer>button,.util-steps button {font-size:11px;min-height:26px}
footer [aria-pressed=true],.utility [aria-pressed=true]{background:#bed65d;color:#101010}
.foot-bpm,.util-tempo b {font-variant-numeric:tabular-nums;color:#b8de60}
.util-steps{display:inline-grid;align-self:center}.util-steps button{min-height:12px;height:12px;padding:0 7px;font-size:10px;line-height:10px}
.cpu-meter {position:absolute;inset:9%;border-radius:23%;overflow:hidden;pointer-events:none;z-index:1}
.cpu-meter::after {content:"";position:absolute;inset:auto 0 0;height:var(--load);background:var(--fill);opacity:.65}
.cpu-pair {position:absolute;right:7%;z-index:2;pointer-events:none;padding:1px 5px;border-radius:3px;background:#151515e8;color:#c0dc79;font-size:11px;font-variant-numeric:tabular-nums;line-height:1.25}
.tile{position:relative}
.utility-shade{z-index:12}
.utility{background:#222;color:#eee;width:min(510px,96vw);max-height:90dvh;overflow:auto;border:1px solid #555;border-radius:9px;text-align:center;box-shadow:0 12px 48px #000a}

.expression-dial {display:grid;place-items:center;font:600 12px system-ui;color:#41dc63;border-color:#111;background:#080808}
.expression-dial:after {display:none}
.param:has(.expression-dial) output,.expression-choice {color:#41dc63}
.device-menu {position:fixed;z-index:100;background:#202020;border:1px solid #505050;border-radius:5px;padding:5px;width:min(260px,96vw);max-height:80dvh;overflow:auto;color:#eee}
.device-menu button {display:block;text-align:left;width:100%;padding:7px;background:transparent}
.device-menu button:not(:disabled):hover,.device-menu button:focus-visible {background:#343434}
.device-menu button[aria-pressed=true],.expression-pane strong {color:#41dc63}
.device-menu .switch-bank {display:flex}
.switch-bank button {text-align:center;padding:6px 0}
.expression-pane {top:65px;left:8px;bottom:45px;display:flex;flex-direction:column;gap:8px;padding:12px}
.expression-pane label {display:flex;align-items:center;gap:8px;padding:4px}
.expression-pane input[type=range] {min-width:0;flex:1;accent-color:#41dc63}
.expression-pane>button:last-child {margin-top:auto}
.panel:has(.block-power) .panelhead {padding:0 6px;height:34px;box-sizing:border-box}
.panel :is(.panelhead,.cab-title):has(.block-power) button {min-height:32px;height:32px;padding-block:0}
.panel .block-power {position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:40px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.block-power svg {pointer-events:none}
.block-power .scene-mark {position:static;transform:none}
.panel .block-power[aria-pressed=true] {color:#61e878}
.panel .block-power[aria-pressed=false] {color:#999}
@media (min-width:600px) and (max-width:1440px) and (min-height:480px) {
  .workspace main:has(.board[data-pair]) > .panel:has(.block-power) {flex:0 1 auto}
  .workspace main:has(.board[data-pair]) > .panel:has(.block-power) ~ .gig-panel {flex-shrink:1;min-height:120px}
  .workspace main:has(.board[data-pair]) > .panel:not(.cabinet) .param {height:clamp(65px,10.5dvh,99px)}
}
.route-output-meter>div {position:absolute;bottom:7px;left:8px;right:8px;display:grid;gap:2px}
.route-output-meter .signal-track {width:100%;height:4px}
.route-output-meter output {bottom:22px}
@media (max-width:599px) and (orientation:portrait) {
  .panel .parameter-page {grid-template-columns:repeat(3,minmax(0,1fr));touch-action:none;user-select:none;-webkit-user-select:none}
  .parameter-page[data-paged] {grid-template-rows:repeat(2,68px)}
  .parameter-page .param {height:68px;min-width:0;padding:5px;overflow:hidden}
  .parameter-page .param:disabled {pointer-events:none}
  .parameter-page .param small {top:5px;left:5px;right:4px;line-height:11px}
  .parameter-page .param output {bottom:6px;left:5px;max-width:calc(100% - 34px);font-size:11px}
  .parameter-page .dial {width:26px;height:26px;right:5px;bottom:5px}
  .parameter-page .dial:after {left:calc(50% - 1px);height:9px;top:2px}
  .parameter-page .scene-mark {left:5px}
  .parameter-page .param-switch {bottom:3px;left:5px;transform:scale(.78);transform-origin:bottom left}
  .parameter-page .param-select {bottom:5px;left:4px;right:4px;padding:5px}
  .panelhead:has(+.parameter-page) .grow {min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media (max-width:599px), (orientation:landscape) and (max-height:500px) and (pointer:coarse) {
  .preset-directory-view.tablet-directory {inset:0;width:100%;height:100dvh;margin:0;border:0;border-radius:0;padding:4px;grid-template-columns:minmax(88px,26%) minmax(0,1fr)}
  .tablet-directory .picker {grid-template-columns:48px minmax(0,1fr)}
  .tablet-directory .directory-tools input {min-width:0;width:100%}
}
.refresh-prompt {width:min(420px,calc(100vw - 32px));box-sizing:border-box;padding:18px;color:#eee;background:#202020;border:1px solid #464646;border-radius:8px}
.refresh-prompt::backdrop {background:#000a}
.refresh-prompt h2 {margin:0;font-size:16px}
.refresh-prompt .actions {display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.refresh-prompt button {background:#333}
</style>
  </head>
  <body>
    <div id="root"></div>
    <script defer src="/app.js"></script>
  </body>
</html>
