<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070707" />
    <title>Quad Desk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
        background: #050505;
        color: #ddd;
        font:
          14px "Segoe UI",
          system-ui,
          sans-serif;
      }
      body {
        margin: 0;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        background: #1e1e1f;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        min-height: 36px;
        padding: 6px 10px;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid #69df80;
      }
      button:disabled {
        opacity: 0.5;
      }
      button:hover {
        background: #29292a;
      }
      .on {
        color: #75ee87;
      }
      .shell {
        max-width: 1700px;
        margin: auto;
        padding: 0 12px 12px;
      }
      header,
      footer,
      .bar,
      .panelhead,
      .actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      header {
        height: 54px;
        justify-content: space-between;
        border-bottom: 1px solid #222;
      }
      header strong {
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .desk-heading { display:grid; min-width:0; gap:3px; }
      .desk-status { font-size:11px; color:#aaa; overflow-wrap:anywhere; }
      .desk-status span::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; background:#888; }
      .desk-status [data-connected=true]::before { background:#4eec69; }
      .shell > header { height:auto; min-height:54px; }
      .signal-meters {
        display: grid;
        gap: 3px;
        width: clamp(117px, 15vw, 210px);
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #141414;
      }
      .signal-line {
        display: grid;
        grid-template-columns: 2.3em minmax(0, 1fr) 6em;
        align-items: center;
        gap: 4px;
        font: 600 10px/1.2 system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .signal-line > :last-child { text-align: right; color: #bbb; white-space: nowrap; }
      .signal-line .signal-clip { color: #ff6468; }
      .signal-track {
        position: relative;
        display: block;
        height: 5px;
        overflow: hidden;
        border-radius: 4px;
        background: #303030;
      }
      .signal-track::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #40d771 0 64%, #f4d44f 81%, #ff554c 96%);
        clip-path: inset(0 calc(100% - var(--signal-fill)) 0 0);
        transition: clip-path 80ms linear;
      }
      .port { position: relative; }
      .port:has(.port-signal) { padding-bottom: 10px; }
      .port-signal { position: absolute; bottom: 4px; left: 15%; right: 15%; }
      .port-signal .signal-track { height: 3px; }
      .port-signal-muted { height: 3px; border-radius: 4px; background: #ff4656; }

      @media (max-width:540px) {
        .shell > header { flex-wrap:wrap; padding:5px 0; }
        .shell > header nav { order:1; width:100%; }
        .desk-heading { flex:1; }
      }
      nav {
        display: flex;
        align-self: stretch;
      }
      nav button {
        background: transparent;
        border-radius: 0;
        color: #888;
        padding: 0 18px;
      }
      nav .current {
        color: white;
        border-top: 2px solid #4eec69;
      }
      .workspace {
        display: grid;
        grid-template-columns: clamp(142px, 22vw, 270px) minmax(0, 1fr);
        gap: 9px;
        margin-top: 8px;
      }
      aside,
      .panel,
      .dialog {
        background: #141415;
        border-radius: 8px;
      }
      aside {
        overflow: auto;
        height: calc(100dvh - 104px);
        padding: 4px;
      }
      .entry {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        width: 100%;
        background: transparent;
        min-height: 42px;
      }
      .entry.model {
        touch-action: pan-y;
      }
      .icon {
        display: grid;
        place-items: center;
        background: #101010;
        border: 2px solid var(--c);
        border-radius: 12px;
        color: #ddd;
        font-size: 23px;
        line-height: 1;
        width: 46px;
        height: 46px;
        flex: none;
      }
      .bar {
        flex-wrap: wrap;
      }
      .preset {
        flex: 1;
        text-align: left;
        font-style: italic;
        min-width: 140px;
      }
      .scene {
        padding: 4px;
        min-width: 30px;
      }
      .scene.active {
        background: #ffc831;
        color: #121212;
      }
      .scroll {
        overflow: auto;
      }
      .board {
        position: relative;
        min-width: 470px;
        display: grid;
        grid-template-columns: 7% repeat(8, 10.75%) 7%;
        grid-template-rows: repeat(4, clamp(61px, 10vh, 98px));
        align-items: center;
        justify-items: center;
      }
      .wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .port,
      .cell {
        z-index: 1;
      }
      .port {
        box-sizing:border-box; width:81%; height:81%; min-height:0; padding:2px;
        border-radius:12px; display:flex; flex-direction:column; align-items:center;
        justify-content:center; gap:5px; color:#ddd; background:#131314;
        font-size:clamp(10px,1.3vw,15px); line-height:1.35;
      }
      .port {position:relative}
      .port[aria-pressed=true] {box-shadow:inset 0 0 0 2px #45ec66}
      .port-status {position:absolute;left:22%;right:22%;height:4px;border-radius:4px}
      .port-input .port-status {top:9%;background:#ffc928}
      .port-output .port-status {bottom:9%;background:#ff3046}
      .port-input {justify-self:start}
      .port-output {justify-self:end}
      .route-node {position:absolute; transform:translate(-50%,-50%); z-index:3;
        width:24px; height:24px; min-height:0; padding:0; border-radius:50%;
        color:white; border:1px solid var(--route); background:var(--route);
        font:600 13px/1 sans-serif; touch-action:none; user-select:none;}
      .route-node.start {--route:#007bec}
      .route-node.end {--route:#da009c}
      .route-node.parked {background:#0a0a0b; color:var(--route)}
      .route-node:hover,.route-node:focus-visible {background:var(--route);color:#fff}
      .route-node::before {content:"";position:absolute;inset:-5px;border-radius:50%}
      .cell {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        position: relative;
      }
      .tile {
        background: #101010;
        padding: 0;
        touch-action: none;
        border-radius: 12px;
      }
      .tile.muted { opacity:1; }
      .tile.muted .icon { filter:brightness(.44); }
      .cell .del {
        display: none;
        position: absolute;
        left: calc(50% + 10px);
        top: calc(50% - 33px);
        background: #aaa;
        color: black;
        border-radius: 100%;
        font: 16px/1 sans-serif;
        min-height: 24px;
        width: 24px;
        padding: 0;
      }
      @media (hover:hover) and (pointer:fine) {
        .cell:hover .del { display:block; }
      }
      .cell .selected + .del {
        display: block;
      }
      .empty {
        background: transparent;
        color: transparent;
      }
      .cell:hover .empty,
      .cell.target .empty,
      .cell.drop .empty {
        color: white;
        background: #222;
      }
      .cell.drop {
        background: #324c3c88;
      }
      .panel {
        margin-top: 8px;
        overflow: hidden;
      }
      .panelhead {
        padding: 5px 8px;
        border-bottom: 1px solid #333;
      }
      .grow {
        flex: 1;
      }
      .params {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .param {
        position: relative;
        height: 99px;
        background: #202021;
        border-right: 1px solid #101010;
        border-bottom: 1px solid #101010;
        border-radius: 0;
        text-align: left;
        padding: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .param { -webkit-touch-callout:none; }
      .param small {
        position: absolute;
        top: 9px;
        left: 8px;
        font-size: 10px;
      }
      .param output {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 11px;
      }
      .gate-track {position:absolute;left:9px;right:9px;bottom:24px;height:7px;background:#111;border-radius:2px;overflow:hidden}
      .gate-track i {display:block;height:100%;background:#f6cb39;transition:width 80ms linear}
      .param-push { position:absolute; bottom:12px; left:10px; padding:8px 16px; border-radius:4px; background:#0b0b0b; color:#ccc; font-weight:600; }
      .choice-param[aria-pressed="true"] .param-push { background:#eee; color:#111; }
      .port-panel .route-title {color:#999;font-weight:400}
      .port-panel .route-title b {font-weight:400;color:#eee;margin-left:4px}
      .port-panel .param-push {left:10%;width:80%;bottom:32%;height:30%;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:400;color:#aaa;background:#121212}
      .port-panel [aria-label="MUTE"][aria-pressed="true"] .param-push {background:#ff292c;color:#111}
      .scene-mark {display:inline-block;font:600 7px/1 monospace;white-space:nowrap;vertical-align:middle;color:inherit}
      .param small .scene-mark {margin-left:5px}
      .param-push .scene-mark {position:absolute;left:5%}
      .port-panel .gate-track {bottom:6px}
      .port-panel .gate-meter output {bottom:19px}
      .port-panel .dial {width:clamp(30px,4vw,54px);height:auto;aspect-ratio:1;bottom:4px;right:6px;border:5px solid #111;box-shadow:inset 0 0 0 2px #080808}
      .port-panel .dial:after {left:calc(50% - 1px);top:0;height:49%}
      .port-panel .param:has(.dial)::before {content:"";position:absolute;right:6px;bottom:4px;width:clamp(30px,4vw,54px);aspect-ratio:1;box-sizing:border-box;background:conic-gradient(from 225deg,#eee 0 var(--sweep),#090909 var(--sweep) 270deg,transparent 270deg);border-radius:50%;mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000);z-index:1;pointer-events:none}
      .choice-param { color:#ddd; }
      .param-switch { position:absolute; bottom:10px; left:8px; display:grid; grid-template-columns:20px auto; grid-template-rows:22px 22px; align-items:center; gap:0 8px; font-size:12px; color:#888; }
      .param-switch i { position:relative; grid-row:span 2; width:18px; height:43px; background:black; border-radius:12px; }
      .param-switch i::after { content:""; position:absolute; left:2px; bottom:var(--switch-position,3px); width:14px; height:14px; border:2px solid var(--c); box-sizing:border-box; border-radius:50%; }
      .param-switch .current { color:#f2f2f2; }
      .param-select { position:absolute; left:8px; right:8px; bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:5px; padding:7px 9px; background:#111; border-radius:5px; font-size:12px; }
      .param-select span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .param-options { position:fixed; z-index:20; overflow:auto; overscroll-behavior:contain; background:#080808; padding:4px; border:1px solid #333; border-radius:7px; box-shadow:0 5px 18px #000a; }
      .param-options button { display:block; width:100%; min-height:36px; padding:6px 10px; text-align:left; color:#aaa; background:none; }
      .param-options button:hover,.param-options button:focus { background:#2d2d2d; }
      .param-options button[aria-selected=true] { background:#2d2d2d; color:#3f6; }
      .dial {
        position: absolute;
        right: 8px;
        bottom: 12px;
        border: 2px solid var(--c);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        transform: rotate(var(--angle));
        background: #121212;
      }
      .dial:after {
        content: "";
        position: absolute;
        top: 3px;
        left: 15px;
        background: #eee;
        height: 13px;
        width: 2px;
      }
      .muted {
        opacity: 0.44;
      }
      .ghost {
        position: fixed;
        pointer-events: none;
        z-index: 6;
        transform: translate(-50%, -50%);
      }
      footer {
        color: #aaa;
        font-size: 12px;
        min-height: 36px;
      }
      .shade {
        position: fixed;
        inset: 0;
        background: #000a;
        display: grid;
        place-items: center;
        z-index: 5;
      }
      .dialog {
        padding: 18px;
        width: min(540px, 92vw);
        max-height: 82dvh;
        overflow: auto;
        border: 1px solid #333;
      }
      .dialog h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      .dialog label {
        display: grid;
        gap: 5px;
        margin: 10px 0;
      }
      .dialog input {
        padding: 8px;
      }
      .dialog .actions {
        margin-top: 12px;
        justify-content: flex-end;
      }
      .directory {
        display: grid;
        gap: 3px;
      }
      .directory button {
        text-align: left;
      }
      .slotno {
        display: inline-block;
        width: 46px;
        color: #999;
      }
      .gig {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 20px 0;
      }
      .gig button {
        height: 15vh;
        font-size: 30px;
      }
      .gig .active {
        background: #ffc831;
        color: #000;
      }
      @media (max-width: 700px) {
        .workspace {
          grid-template-columns: 100px minmax(0, 1fr);
        }
        aside {
          font-size: 11px;
        }
        .entry {
          padding: 4px;
          gap: 4px;
        }
        .entry .icon {
          width: 28px;
          height: 28px;
          font-size: 16px;
        }
        .params {
          grid-template-columns: repeat(2, 1fr);
        }
        nav button {
          padding: 0 8px;
        }
        .scene {
          min-width: 28px;
        }
      }
      @media (pointer: coarse) {
        button {
          min-height: 42px;
        }
        .cell .del {
          min-height: 26px;
          width: 26px;
        }
      }
      .picker {
        display: grid;
        grid-template-columns: 144px 1fr;
        gap: 14px;
        margin-top: 12px;
      }
      .banks {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        align-content: start;
      }
      .banks button {
        padding: 3px;
      }
      .directory {
        align-content: start;
      }
      .dialog > input {
        width: 100%;
      }
      @media (max-width: 480px) {
        .picker {
          grid-template-columns: 84px 1fr;
        }
        .banks {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      aside.expanded {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        padding: 0;
        overflow: hidden;
      }
      .models,
      .rail {
        overflow-y: auto;
      }
      .rail button {
        background: transparent;
        border-radius: 0;
        display: grid;
        place-items: center;
        width: 100%;
        height: 52px;
        padding: 0;
      }
      .rail .icon {
        border: 0;
        background: transparent;
        font-size: 17px;
        width: 24px;
        height: 28px;
        color: #888;
      }
      .rail .category-label {display:none}
      .rail button[aria-pressed=true] {
        color:#abf3b6;
        background:#233c29;
        box-shadow:inset 3px 0 #45ec66;
      }
      .models .entry.model {
        font-size: 12px;
        min-height: 35px;
      }
      .models .entry.model.on {
        background: #222;
      }
      .icon {
        object-fit: contain;
        background: none;
        border: 0;
      }
      .entry.model .icon {
        width: 26px;
        height: 26px;
      }
      .entry.model small {
        display: block;
        color: #999;
      }
      .libsearch {
        width: 100%;
        padding: 7px;
        margin: 5px 0;
      }
      .workspace main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 106px);
      }
      .gig-panel {
        margin-top: auto;
        padding-top: 10px;
        display: grid;
        grid-template-columns: minmax(92px, 20%) 1fr;
        min-height: clamp(145px, 28vh, 265px);
      }
      .gig-side {
        display: flex;
        flex-direction: column;
        background: #2d2d2d;
        border-radius: 6px 0 0 6px;
        overflow: hidden;
      }
      .gig-side > div,
      .gig-side button {
        background: #202020;
        padding: 8px;
        text-align: left;
      }
      .gig-side strong {
        flex: 1;
        display: flex;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
        padding: 8px;
      }
      .gig-side button {
        border-top: 1px solid #080808;
        font-size: 11px;
      }
      .gig-scenes {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 1fr 1fr;
        gap: 1px;
        border-radius: 0 6px 6px 0;
        overflow: hidden;
        background: #090909;
      }
      .gig-scenes button {
        position: relative;
        border-radius: 0;
        isolation: isolate;
        overflow: hidden;
        color: #d0d0d0;
        background: var(
          --scene-shade,
          color-mix(in srgb, var(--scene-color) 10%, #141414)
        );
        font-size: clamp(12px, 1.7vw, 22px);
        padding: 4px;
      }
      .gig-scenes button:disabled {
        opacity: 1;
        cursor: default;
      }
      .gig-scenes button.active {
        background: var(--scene-color);
        color: #101010;
      }
      .gig-scenes b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(40px, 8vh, 95px);
        font-weight: 600;
        color: var(--scene-color);
        opacity: 0.11;
        z-index: -1;
      }
      .gig-scenes button.active b {
        color: #151515;
      }
      .plugin-children {
        border-left: 1px solid #363636;
        margin: 0 0 5px 12px;
        padding-left: 5px;
      }
      .product[aria-expanded="true"] {
        color: #65df7a;
        background: #242424;
      }
      .product span {
        color: #888;
      }
      .plugin-section summary {
        padding: 10px 4px;
        font-size: 10px;
        color: #bbb;
        cursor: pointer;
      }
      .product {
        border: 1px solid #333;
        margin: 2px 0;
        font-size: 12px;
      }
      .foot-gig {
        min-height: 24px;
        font-size: 10px;
      }
      .foot-gig[aria-pressed="true"] {
        background: #888;
        color: #171717;
      }
      footer {
        gap: 14px;
      }
      .scroll-end {
        height: 2px;
      }
      .capture-tools,
      .capture-tabs {
        display: flex;
        gap: 3px;
        margin: 4px 0;
      }
      .capture-tools input,
      .capture-tools select {
        min-width: 0;
        flex: 1;
        width: 100%;
        background: #242424;
        border: 0;
        border-radius: 3px;
        padding: 5px;
      }
      .capture-tabs button {
        flex: 1;
        font-size: 10px;
      }
      .capture-tabs button[aria-pressed="true"] {
        background: #353535;
      }
      .folder-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        margin: 2px 0;
        font-size: 11px;
        min-height: 35px;
        border: 1px solid #333;
        background: #202020;
      }
      .capture-children {
        padding-left: 7px;
      }
      .pin {
        color: #42e753;
      }
      .capture-browser .entry.model {
        min-height: 32px;
      }
      .capture-browser .entry.model small {
        display: none;
      }

footer {gap:4px;flex-wrap:wrap}
footer>button,.util-steps button {font-size:11px;min-height:26px}
footer [aria-pressed=true],.utility [aria-pressed=true]{background:#bed65d;color:#101010}
.foot-bpm,.util-tempo b {font-variant-numeric:tabular-nums;color:#b8de60}
.util-steps{display:inline-grid;align-self:center}.util-steps button{min-height:12px;height:12px;padding:0 7px;font-size:10px;line-height:10px}
.cpu-meter {position:absolute;inset:9%;border-radius:23%;overflow:hidden;pointer-events:none;z-index:1}
.cpu-meter::after {content:"";position:absolute;inset:auto 0 0;height:var(--load);background:var(--fill);opacity:.65}
.cpu-pair {position:absolute;right:7%;z-index:2;pointer-events:none;padding:1px 5px;border-radius:3px;background:#151515e8;color:#c0dc79;font-size:11px;font-variant-numeric:tabular-nums;line-height:1.25}
.tile{position:relative}
.utility-shade{z-index:12}
.utility{background:#222;color:#eee;width:min(510px,96vw);max-height:90dvh;overflow:auto;border:1px solid #555;border-radius:9px;text-align:center;box-shadow:0 12px 48px #000a}
.utility header,.util-tabs,.util-scenes,.tuner-bottom,.util-tempo,.pitch-label{display:flex;align-items:center;gap:5px}
.utility header{padding:0 14px;background:#303030}.utility header strong{margin-right:auto}
.utility select,.utility input[type=number]{background:#323232;border:1px solid #555;border-radius:4px;padding:6px;color:#fff}
.util-tabs,.util-scenes,.util-tempo{justify-content:center;margin:14px}
.util-scenes button{flex:1;min-width:0}.util-tempo{gap:10px}.util-tempo b{font-size:60px}.util-tempo>button{width:60px;height:60px;border-radius:50%}
.util-options{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:left}
.util-options label,.utility small{display:block;color:#ccc;padding:4px}.util-options input,.util-options select{width:100%;display:block;margin-top:4px}
.util-beats{display:flex;gap:5px;justify-content:center;margin:12px}.util-beats i{background:#555;width:10px;height:10px;border-radius:50%}.util-beats .active{background:#c2df60}.metronome{margin:8px}.util-note{font-size:42px;padding:24px 0;height:105px}.util-note small{display:inline;font-size:18px}
.pitch-scale{margin:10px 8%;height:4px;background:linear-gradient(90deg,#967342,#bfd769,#967342);position:relative}
.pitch-scale i{position:absolute;width:14px;height:14px;top:50%;transform:translate(-50%,-50%);background:#cae784;border-radius:50%}.pitch-label,.tuner-bottom{justify-content:space-between;padding:5px 8%}
.tuner-bottom{border-top:1px solid #444;padding:15px 10px;margin-top:32px}.tuner-bottom input[type=number]{width:74px}

      .device-tools {display:flex;align-items:center;gap:3px}
      .device-tools button {background:transparent;padding:4px;color:#dedede;font-size:19px}
      .device-tools button:disabled {opacity:.32}
      .device-tools .master-dial {position:relative;width:40px;min-height:36px;touch-action:none;user-select:none;border-left:1px solid #333;border-radius:0}
      .master-dial i {display:block;margin:auto;width:26px;height:26px;border:1px solid #aaa;border-radius:50%;transform:rotate(var(--turn));position:relative}
      .master-dial i::after {content:"";position:absolute;background:#eee;height:5px;width:2px;left:50%;top:0}
      .device-tools .master-dial:disabled {opacity:1;cursor:default}
      .device-tools .master-dial.pickup {color:#70ed86}
      .master-dial.pickup i {border-color:currentColor}
      .master-dial.pickup i::after {background:currentColor}
      .device-tools .master-lock {display:grid;place-items:center;min-width:30px;min-height:36px}
      .master-dial span {position:absolute;font-size:10px;inset:0;display:grid;place-items:center}
      .wire-hit,.wire-branch {pointer-events:stroke;touch-action:none}
      .cell {pointer-events:none}
      .cell button {pointer-events:auto}
      .port-list summary {margin:5px 3px;padding:9px;background:#303030;cursor:pointer;border-radius:4px}
      .port-list [aria-pressed=true],.panelhead [aria-pressed=true] {color:#70ed86;background:#141414}
      .board {user-select:none;-webkit-user-select:none}
      .library-toggle {display:grid;place-items:center;width:24px;height:60px;min-height:0;padding:0;
        border:0;border-radius:0;background:transparent;color:rgba(255,255,255,.52);transform:translateY(-50%);touch-action:manipulation}
      .library-toggle:hover,.library-toggle:focus-visible {background:transparent;color:#eee}
      .library-toggle:focus-visible {outline:0}
      .library-toggle:focus-visible span {outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
      .library-toggle span {display:grid;place-items:center;width:16px;height:24px}
      .library-toggle span::before {content:"";width:8px;height:8px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg)}
      .library-toggle[aria-expanded=true] span::before {transform:rotate(-135deg)}
      @media (orientation:landscape) {
        .workspace {
          --rail-width:44px;--sidebar-width:var(--rail-width);--list-width:min(260px,30vw);
          position:relative;grid-template-columns:var(--sidebar-width) minmax(0,1fr);column-gap:24px;
          transition:grid-template-columns .18s ease-out;
        }
        .workspace.library-open {--sidebar-width:calc(var(--rail-width) + var(--list-width))}
        #block-library {display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);overflow:hidden;padding:0}
        #block-library .rail {overflow-x:hidden;scrollbar-width:none}
        #block-library .rail::-webkit-scrollbar {display:none}
        #block-library .models {width:var(--list-width);background:#171718;padding:4px;visibility:hidden}
        .library-open #block-library .models {visibility:visible}
        .library-toggle {position:absolute;z-index:4;left:var(--sidebar-width);top:min(45dvh,50%);transition:left .18s ease-out}
      }
      @media (orientation:portrait) {
        #block-library:not(.expanded) .rail {display:none}
        .workspace {position:relative;display:block}
        .workspace main {padding-left:12px}
        .library-toggle {position:fixed;z-index:4;left:0;top:50dvh}
        #block-library {position:fixed;z-index:8;inset:0;width:100%;height:100dvh;
          padding:max(4px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));
          border-radius:0;overscroll-behavior:contain;visibility:hidden;transform:translateX(-100%);
          transition:transform .18s ease-out,visibility 0s linear .18s}
        .library-open #block-library {visibility:visible;transform:none;transition-delay:0s}
        .library-open .library-toggle {z-index:9;left:auto;right:env(safe-area-inset-right,0px);width:40px}
        body:has(.library-open) {overflow:hidden}
        .shell:has(.library-open) > :is(header,footer), .library-open main {visibility:hidden}
        .workspace:not(.library-open) #block-library {pointer-events:none}
        .workspace .entry.model {touch-action:pan-y}
      }
      @media (min-width:600px) and (any-pointer:coarse) {
        .library-open #block-library.expanded .rail button {
          display:flex;align-items:center;gap:8px;padding-inline:8px;text-align:left;
        }
        .library-open #block-library.expanded .category-label {display:block;font-size:12px;line-height:1.2}
      }
      @media (min-width:600px) and (any-pointer:coarse) and (orientation:landscape) {
        .workspace.library-open:has(#block-library.expanded) {--rail-width:clamp(126px,15vw,160px);--list-width:min(230px,25vw)}
      }
      @media (min-width:600px) and (any-pointer:coarse) and (orientation:portrait) {
        .library-open #block-library.expanded {grid-template-columns:clamp(138px,24vw,196px) minmax(0,1fr)}
      }
      @media (prefers-reduced-motion:reduce) {.workspace,#block-library,.workspace .library-toggle {transition:none}}
</style>
