name: Signed Pi application update
on:
  push:
    branches: [main]
    paths: ['source/**', '.github/workflows/pi-updates.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pi-update-channel
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.PI_UPDATE_CHANNEL == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix source ci && npm --prefix source run build
      - run: python -m pip install cryptography
      - name: Build signed package
        env:
          SIGNING_PEM: ${{ secrets.PI_UPDATE_SIGNING_PEM }}
        run: |
          set -eu
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_PEM" > "$key"
          openssl pkey -in "$key" -pubout | diff - source/release/update-public.pem
          python source/release/package.py "$key" update.zip
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          archive = pathlib.Path("update.zip")
          with zipfile.ZipFile(archive) as z:
              manifest = z.read("manifest.json")
          metadata = dict(build=os.environ["GITHUB_SHA"], version=json.loads(manifest)["version"],
                          manifest=hashlib.sha256(manifest).hexdigest(), sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          pathlib.Path("latest.json").write_text(json.dumps(metadata))
          PY
      - name: Publish ZIP and metadata together
        run: |
          set -eu
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          parent=()
          if git ls-remote --exit-code origin refs/heads/pi-updates >/dev/null; then
            git fetch origin refs/heads/pi-updates
            parent=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/channel-index"
          git read-tree --empty
          git add -f -- latest.json update.zip
          commit=$(git commit-tree "$(git write-tree)" "${parent[@]}" -m "feat: Pi 앱 업데이트 게시")
          git push origin "$commit:refs/heads/pi-updates"
